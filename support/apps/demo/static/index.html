<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Terraform Playground</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header><span class="eyebrow">TERRAFORM PLAYGROUND / LOCAL LAB</span><h1 id="title">教材を読み込んでいます</h1><p id="description">このPCの中で動く、小さなシステムです。</p></header>
  <main>
    <div id="message" role="status" aria-live="polite">接続を確認しています…</div>
    <section>
      <div class="section-heading"><h2 id="items-heading">保存したデータ</h2><button id="refresh" class="secondary" type="button">一覧を更新</button></div>
      <form id="notes-form" hidden><label for="content">メモの内容</label><textarea id="content" name="content" required maxlength="2000" placeholder="Terraformで作ったシステムに、最初のメモを保存してみよう。"></textarea><button type="submit">メモを保存</button></form>
      <form id="files-form" hidden><label for="file">ファイル（1MiBまで）</label><input id="file" name="file" type="file" required><div id="title-field" hidden><label for="file-title">表示名</label><input id="file-title" name="title" maxlength="200" placeholder="例：学習の記録"></div><button type="submit">アップロード</button></form>
      <p id="empty" class="muted">まだ保存したデータはありません。</p>
      <ul id="items" class="items"></ul>
    </section>
    <section id="jobs-section" hidden>
      <div class="section-heading"><h2>バックグラウンド処理</h2><button id="export" type="button">一覧をCSVに出力</button></div>
      <p class="muted">処理を受け付けた後、ワーカーがCSVを作ります。完了した結果はダウンロードできます。</p>
      <ul id="jobs" class="items"></ul>
    </section>
    <footer>ローカル専用の練習環境です。学習の手順と片付け方は、教材フォルダのREADMEを参照してください。</footer>
  </main>
</body>
</html>
