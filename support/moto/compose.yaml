services:
  moto:
    image: motoserver/moto:5.2.4
    ports:
      - "127.0.0.1:${MOTO_HOST_PORT:-5000}:5000"
    environment:
      MOTO_PORT: "5000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/moto-api/', timeout=2)"
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
